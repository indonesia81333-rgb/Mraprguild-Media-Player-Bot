name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python build.py
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mraprguild-media-player-bot .
      - name: Smoke test container
        run: |
          docker run -d --name bot -p 3000:3000 mraprguild-media-player-bot
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health
          docker rm -f bot
